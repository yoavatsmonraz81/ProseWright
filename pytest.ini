[pytest]
testpaths = tests

# tests/phase6 is not a pytest module: it is a standalone integration script
# that `tests/phase6/run_tests.sh` drives after booting an API server on an
# isolated home, and its functions take an `--api-base` argument rather than
# fixtures. Collecting it here only manufactures false failures.
#   run it with:  bash tests/phase6/run_tests.sh
addopts = -q --ignore=tests/phase6

# Fixture homes for the alternate-project tests (Holmes / GoT). Data, not tests.
norecursedirs = tests/phase6 tests/holmes tests/got .git __pycache__
